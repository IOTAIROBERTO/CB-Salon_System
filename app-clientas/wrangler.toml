# Configuración de Cloudflare Pages para la app de clientas (proyecto «cristinaborquez-app»).
# Los secretos (DEXIE_*, SESION_SECRETO, WA_*) no van aquí: se ponen con «npx wrangler pages secret put».
name = "cristinaborquez-app"
pages_build_output_dir = "dist"
compatibility_date = "2025-10-01"

# Topes atómicos de la entrada con código (Durable Object del Worker «cb-limites», carpeta limites/)
[[durable_objects.bindings]]
name = "LIMITES"
class_name = "Contador"
script_name = "cb-limites"
