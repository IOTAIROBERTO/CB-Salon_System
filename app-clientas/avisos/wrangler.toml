# Worker con horario para los avisos automáticos a clientas (confirmación y recordatorio por WhatsApp).
# Publicar: npx wrangler deploy --config avisos/wrangler.toml   ·   Secretos: los mismos de la app (DEXIE_*, WA_*)
name = "cb-avisos"
main = "index.ts"
compatibility_date = "2025-10-01"
workers_dev = false   # solo corre por horario: sin dirección pública

[triggers]
crons = ["*/10 * * * *"]
