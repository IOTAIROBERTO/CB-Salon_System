<script>
var car = document.getElementById('carrusel'), cuenta = document.getElementById('cuenta');
var visibles = function () { return [].slice.call(car.children).filter(function (s) { return !s.hidden; }); };
var paso = function () { var s = visibles()[0]; return s ? s.offsetWidth + 16 : 0; };
function contar() { var n = visibles().length, i = Math.min(n, Math.round(car.scrollLeft / (paso() || 1)) + 1); cuenta.textContent = i + ' / ' + n; }
document.querySelector('.ant').onclick = function () { car.scrollBy({ left: -paso() }); };
document.querySelector('.sig').onclick = function () { car.scrollBy({ left: paso() }); };
car.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') car.scrollBy({ left: paso() });
  if (e.key === 'ArrowLeft') car.scrollBy({ left: -paso() });
});
car.addEventListener('scroll', function () { requestAnimationFrame(contar); });
document.querySelectorAll('.chip').forEach(function (b) {
  b.onclick = function () {
    document.querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('activo', x === b); });
    [].forEach.call(car.children, function (s) { s.hidden = !!b.dataset.g && s.dataset.g !== b.dataset.g; });
    car.scrollLeft = 0; contar();
  };
});
contar();
</script>
